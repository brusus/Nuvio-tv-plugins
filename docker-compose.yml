services:
  easystreams:
    build: .
    container_name: easystreams
    ports:
      - "7000:7000"
    environment:
      # Credenziali del piano premium StreamingCommunity: lette da un file .env
      # locale (NON committato). Lascia vuoto per usare l'addon in anonimo (720p).
      - SC_ACCOUNT_EMAIL=${SC_ACCOUNT_EMAIL:-}
      - SC_ACCOUNT_PASSWORD=${SC_ACCOUNT_PASSWORD:-}
      - PORT=7000
      - NODE_ENV=production
      - VERBOSE_LOGS=0
      - QUIET_PROVIDER_LOGS=1
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Il bypass Cloudflare (Scrapling) viene gestito internamente dall'addon
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    devices:
      - /dev/net/tun
    restart: unless-stopped

  # Tunnel Cloudflare: espone l'addon (easystreams:7000) su un URL HTTPS pubblico,
  # cosi' Stremio lo raggiunge da ovunque (telefono fuori casa, Stremio web) senza
  # aprire porte sul router. "Quick tunnel": nessun account, URL casuale
  # https://<parole>.trycloudflare.com. L'URL cambia a ogni riavvio del container
  # (per un URL fisso serve un tunnel "named" con account Cloudflare - vedi note).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://easystreams:7000
    depends_on:
      - easystreams
    restart: unless-stopped
